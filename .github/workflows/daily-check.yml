name: Price Check

on:
  # No GitHub schedule cron — triggering is driven by the Hermes agent (repo-watch),
  # which calls workflow_dispatch. This removes the unreliable GitHub best-effort cron.
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install jsonschema --quiet

      - name: Run check
        run: python scripts/daily_check.py --stale-report /tmp/stale-plans.md | tee /tmp/daily-check.log

      - name: Validate data
        run: python scripts/validate.py

      - name: Open PR for price-sync changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "price-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The checkout runs on the trigger-time SHA; align the base with the latest main
          # first (check results are stashed, then reapplied on top of the fresh base).
          git stash -u 2>/dev/null || true
          git pull --rebase origin main 2>/dev/null || git reset --hard origin/main
          git stash pop 2>/dev/null || true

          if git diff --quiet; then
            echo "No data changes this run; nothing to do."
          else
            # auto-bump version (content update) with a DETAILED, HUMAN-READABLE,
            # bilingual changelog message summarizing exactly what changed this run.
            SUMMARY_EN=$(sed -n '/SYNC_SUMMARY_EN_BEGIN/,/SYNC_SUMMARY_EN_END/p' /tmp/daily-check.log | sed '1d;$d' | head -40)
            SUMMARY_ZH=$(sed -n '/SYNC_SUMMARY_ZH_BEGIN/,/SYNC_SUMMARY_ZH_END/p' /tmp/daily-check.log | sed '1d;$d' | head -40)
            [ -z "$SUMMARY_EN" ] && SUMMARY_EN="chore: price sync"
            [ -z "$SUMMARY_ZH" ] && SUMMARY_ZH="价格同步"

            python scripts/bump_version.py --content --message "$SUMMARY_EN" --message-zh "$SUMMARY_ZH" --date "$(date -u +%Y-%m-%dT%H:%M)"
            python scripts/build_human.py
            python scripts/validate.py
            git add -A
            git commit -m "chore: price sync [skip ci]"

            # P1 (agent autonomy): NEVER push straight to main. Open a PR instead so the
            # deterministic gate (pr-check) + the Hermes agent review can act on it.
            BRANCH="bot/price-sync-$(date -u +%Y%m%dT%H%M)"
            git checkout -b "$BRANCH"
            git push -u origin "$BRANCH" 2>/dev/null || git push -u origin "$BRANCH" --force

            printf '%s' "Automated price sync." > /tmp/pr-body.md
            printf '\n\n%s' "$SUMMARY_EN" >> /tmp/pr-body.md
            printf '\n\n---\n%s' "$SUMMARY_ZH" >> /tmp/pr-body.md

            EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              echo "Updated existing PR #$EXISTING"
            else
              gh pr create --head "$BRANCH" --base main \
                --title "bot: price sync" \
                --body-file /tmp/pr-body.md 2>/dev/null \
                || echo "::warning::PR creation failed — branch $BRANCH pushed but no PR (Hermes repo-watch should surface this)."
            fi
          fi

      - name: Sync stale-plans issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STALE=/tmp/stale-plans.md
          EXISTING=$(gh issue list --search "价格核实提醒" --state open --json number -q '.[0].number' 2>/dev/null || true)
          if grep -q "待人工核实" "$STALE" && ! grep -q "均在" "$STALE"; then
            BODY=$(cat "$STALE")
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY" >/dev/null
              echo "Updated stale-plans issue #$EXISTING"
            else
              gh issue create --title "价格核实提醒（订阅计划过期）" --body "$BODY" --label "stale-plans" >/dev/null
              echo "Created stale-plans issue"
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" >/dev/null
              echo "Closed stale-plans issue #$EXISTING"
            else
              echo "No stale plans; no issue needed."
            fi
          fi
