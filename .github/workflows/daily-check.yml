name: Daily Price Check

on:
  schedule:
    # 每天 01:23 UTC (约北京 09:23) 自动运行
    - cron: '23 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install jsonschema --quiet

      - name: Run daily check
        run: python scripts/daily_check.py --stale-report /tmp/stale-plans.md

      - name: Validate data
        run: python scripts/validate.py

      - name: Open or update PR with changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No data changes today; no PR needed."
          else
            BRANCH="bot/daily-sync-$(date +%Y%m%d)"
            git config user.name "price-sync-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "chore: daily price sync [skip ci]"
            git push -u origin "$BRANCH"
            EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              gh pr edit "$EXISTING" --title "chore: daily price sync" >/dev/null
              echo "Updated existing PR #$EXISTING"
            else
              gh pr create --title "chore: daily price sync" --body "自动价格同步 PR，由 GitHub Actions 每日生成。请 Review 后合并。" >/dev/null
              echo "Created PR for branch $BRANCH"
            fi
          fi

      - name: Sync stale-plans issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STALE=/tmp/stale-plans.md
          EXISTING=$(gh issue list --search "每日价格核实提醒" --state open --json number -q '.[0].number' 2>/dev/null || true)
          if grep -q "待人工核实" "$STALE" && ! grep -q "均在" "$STALE"; then
            BODY=$(cat "$STALE")
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY" >/dev/null
              echo "Updated stale-plans issue #$EXISTING"
            else
              gh issue create --title "每日价格核实提醒（订阅计划过期）" --body "$BODY" --label "stale-plans" >/dev/null
              echo "Created stale-plans issue"
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" >/dev/null
              echo "Closed stale-plans issue #$EXISTING"
            else
              echo "No stale plans; no issue needed."
            fi
          fi
