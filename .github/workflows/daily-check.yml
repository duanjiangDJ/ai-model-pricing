name: Price Check

on:
  schedule:
    # 每 3 小时整点运行（UTC）：0,3,6,9,12,15,18,21 点
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install jsonschema --quiet

      - name: Run check
        run: python scripts/daily_check.py --stale-report /tmp/stale-plans.md

      - name: Validate data
        run: python scripts/validate.py

      - name: Auto-merge changes into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No data changes this run; nothing to merge."
          else
            git config user.name "price-sync-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # auto-bump version (content update) + changelog (UTC minute precision)
            python scripts/bump_version.py --content --message "chore: price sync" --date "$(date -u +%Y-%m-%dT%H:%M)"
            python scripts/build_human.py
            python scripts/validate.py
            git add -A
            git commit -m "chore: price sync [skip ci]"
            if [ -n "$GH_PAT" ]; then
              # bot uses a PAT (repo admin) to bypass branch protection for price syncs only
              git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
              git pull --rebase origin main
              git push origin main
              echo "Changes auto-merged into main via bot PAT."
            else
              # no PAT: fall back to opening a PR
              BRANCH="bot/price-sync-$(date -u +%Y%m%dT%H%M)"
              git checkout -b "$BRANCH"
              git push -u origin "$BRANCH" 2>/dev/null || git push -u origin "$BRANCH" --force
              EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)
              if [ -n "$EXISTING" ]; then
                echo "Updated existing PR #$EXISTING"
              else
                PR_URL=$(gh api -X POST "repos/${{ github.repository }}/pulls" \
                  -f "title=chore: price sync" -f "head=$BRANCH" -f "base=main" \
                  -f "body=Automated price sync PR. Add a GH_PAT repo secret (admin) to enable direct auto-merge." \
                  --jq '.html_url' 2>/dev/null || true)
                if [ -n "$PR_URL" ]; then
                  echo "Created PR: $PR_URL"
                else
                  echo "::error::PR creation failed. Branch $BRANCH was pushed but main is NOT updated. Add a GH_PAT secret (repo admin) to enable auto-merge, or enable 'Allow GitHub Actions to create and approve pull requests' in Settings -> Actions -> General."
                  gh issue create --title "⚠️ 价格同步 PR 创建失败（main 未更新）" \
                    --body "本次价格同步检测到数据变化并已推送到分支 \`$BRANCH\`，但 GitHub Actions 没有权限创建 PR（仓库未开启 'Allow GitHub Actions to create and approve pull requests'，且未配置 \`GH_PAT\` secret），因此 **main 未更新**。

修复方式（任选其一）：
1. 在仓库 Settings → Secrets and variables → Actions 添加 \`GH_PAT\`（仓库 admin 权限的 Personal Access Token）→ 之后自动合并到 main；
2. 或 Settings → Actions → General → 勾选 *Allow GitHub Actions to create and approve pull requests* → 之后会改为创建 PR 等待合并。"
                    --label "bot" 2>/dev/null || true
                  exit 1
                fi
              fi
            fi
          fi

      - name: Sync stale-plans issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STALE=/tmp/stale-plans.md
          EXISTING=$(gh issue list --search "价格核实提醒" --state open --json number -q '.[0].number' 2>/dev/null || true)
          if grep -q "待人工核实" "$STALE" && ! grep -q "均在" "$STALE"; then
            BODY=$(cat "$STALE")
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY" >/dev/null
              echo "Updated stale-plans issue #$EXISTING"
            else
              gh issue create --title "价格核实提醒（订阅计划过期）" --body "$BODY" --label "stale-plans" >/dev/null
              echo "Created stale-plans issue"
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" >/dev/null
              echo "Closed stale-plans issue #$EXISTING"
            else
              echo "No stale plans; no issue needed."
            fi
          fi
