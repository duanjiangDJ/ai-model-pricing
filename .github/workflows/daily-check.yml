name: Price Check

on:
  schedule:
    # 每 3 小时整点运行（UTC）：0,3,6,9,12,15,18,21 点
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install jsonschema --quiet

      - name: Run check
        run: python scripts/daily_check.py --stale-report /tmp/stale-plans.md

      - name: Validate data
        run: python scripts/validate.py

      - name: Auto-merge changes into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No data changes this run; nothing to merge."
          else
            git config user.name "price-sync-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # auto-bump version (content update) + changelog (minute precision)
            python scripts/bump_version.py --content --message "chore: price sync" --date "$(date -u +%Y-%m-%dT%H:%M)"
            python scripts/build_human.py
            python scripts/validate.py
            git add -A
            git commit -m "chore: price sync [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Changes auto-merged into main."
          fi

      - name: Sync stale-plans issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STALE=/tmp/stale-plans.md
          EXISTING=$(gh issue list --search "价格核实提醒" --state open --json number -q '.[0].number' 2>/dev/null || true)
          if grep -q "待人工核实" "$STALE" && ! grep -q "均在" "$STALE"; then
            BODY=$(cat "$STALE")
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY" >/dev/null
              echo "Updated stale-plans issue #$EXISTING"
            else
              gh issue create --title "价格核实提醒（订阅计划过期）" --body "$BODY" --label "stale-plans" >/dev/null
              echo "Created stale-plans issue"
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" >/dev/null
              echo "Closed stale-plans issue #$EXISTING"
            else
              echo "No stale plans; no issue needed."
            fi
          fi
