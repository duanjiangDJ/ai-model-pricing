name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install jsonschema --quiet

      - name: Validate machine data
        run: python scripts/validate.py

      - name: Repository audit
        run: python scripts/audit.py

      - name: Check generated pages are up to date
        run: |
          python scripts/build_human.py
          if ! git diff --exit-code --quiet -- data/human/; then
            echo "::error::data/human/ is out of sync. Run 'python scripts/build_human.py' and commit the regenerated pages."
            exit 1
          fi

      - name: Check version files are consistent
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          S=$(python -c "import json;print(json.load(open('data/machine/schema.json'))['version'])")
          I=$(python -c "import json;print(json.load(open('data/machine/index.json'))['schema_version'])")
          echo "VERSION=$V schema=$S index=$I"
          if [ "$V" != "$S" ] || [ "$V" != "$I" ]; then
            echo "::error::Version mismatch: VERSION($V) vs schema($S) vs index($I). Bump all three together."
            exit 1
          fi

      - name: Require CHANGELOG + VERSION update for data/script changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          if echo "$CHANGED" | grep -qE '^(data/machine/|scripts/|VERSION|CHANGELOG)'; then
            NEWV=$(cat VERSION | tr -d '[:space:]')
            OLDV=$(git show "$BASE_SHA":VERSION | tr -d '[:space:]')
            if [ "$NEWV" = "$OLDV" ]; then
              echo "::error::data/machine/ or scripts/ changed but VERSION was NOT bumped. Run: python scripts/bump_version.py --content|--feature --message '...'"
              exit 1
            fi
            if ! grep -q "^## $NEWV" CHANGELOG.md; then
              echo "::error::VERSION bumped to $NEWV but CHANGELOG.md has no '## $NEWV' section. Add a changelog entry (or run bump_version.py)."
              exit 1
            fi
            if ! grep -q "^## $NEWV" CHANGELOG.zh-CN.md; then
              echo "::error::CHANGELOG.zh-CN.md has no '## $NEWV' section either. Keep both changelogs in sync."
              exit 1
            fi
            echo "OK: VERSION bumped to $NEWV with changelog entries."
          else
            echo "No data/script changes; version bump not required."
          fi
