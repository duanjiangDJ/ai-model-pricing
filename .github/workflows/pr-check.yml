name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install jsonschema --quiet

      - name: Validate data
        run: python scripts/validate.py

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Repository audit
        run: python scripts/audit.py

      - name: Check generated pages are up to date
        run: |
          python scripts/build_human.py
          if ! git diff --exit-code --quiet -- data/view/; then
            echo "::error::data/view/ is out of sync. Run 'python scripts/build_human.py' and commit the regenerated pages."
            exit 1
          fi

      - name: Check version files are consistent
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          S=$(python -c "import json;print(json.load(open('data/feed/schema.json'))['version'])")
          I=$(python -c "import json;print(json.load(open('data/feed/index.json'))['schema_version'])")
          echo "VERSION=$V schema=$S index=$I"
          if [ "$V" != "$S" ] || [ "$V" != "$I" ]; then
            echo "::error::Version mismatch: VERSION($V) vs schema($S) vs index($I). Bump all three together."
            exit 1
          fi

      - name: Security sanity check (no repo-breaking changes)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          FILES=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUM/files" --jq '.[].filename')
          echo "changed files:"; echo "$FILES"
          # 1. core files must not be deleted
          for core in scripts/validate.py scripts/audit.py scripts/router.py scripts/toolbox.py scripts/build_human.py scripts/daily_check.py data/feed/schema.json data/feed/index.json; do
            if echo "$FILES" | grep -qx "$core"; then
              ST=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUM/files" --jq ".[] | select(.filename==\"$core\") | .status")
              if [ "$ST" = "removed" ]; then
                echo "::error::PR removes core file $core. Not allowed."
                exit 1
              fi
            fi
          done
          # 2. dangerous patterns in python files (scan head version)
          BAD=""
          for f in $(echo "$FILES" | grep -E '\.py$'); do
            CONTENT=$(gh api "repos/${{ github.repository }}/contents/$f?ref=$HEAD_SHA" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null)
            HIT=$(echo "$CONTENT" | grep -nE 'eval\s*\(|exec\s*\(|os\.system|shell\s*=\s*True|pickle\.loads|base64\.b64decode|ctypes\.|__import__\(' || true)
            if [ -n "$HIT" ]; then
              BAD="$BAD\n$f: $HIT"
            fi
          done
          if [ -n "$BAD" ]; then
            echo "::error::Suspicious code patterns:$BAD"
            exit 1
          fi
          # 3. python syntax check for added/renamed .py files
          for f in $(echo "$FILES" | grep -E '\.py$'); do
            gh api "repos/${{ github.repository }}/contents/$f?ref=$HEAD_SHA" --jq '.content' 2>/dev/null | base64 -d > /tmp/check.py 2>/dev/null
            if [ -s /tmp/check.py ]; then
              python -m py_compile /tmp/check.py || { echo "::error::Python syntax error in $f"; exit 1; }
            fi
          done
          # 4. workflows must not be deleted
          for wf in $(echo "$FILES" | grep -E '^\.github/workflows/.*\.yml$'); do
            ST=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUM/files" --jq ".[] | select(.filename==\"$wf\") | .status")
            if [ "$ST" = "removed" ]; then
              echo "::error::PR removes workflow $wf. Not allowed."
              exit 1
            fi
          done
          echo "Security sanity check passed."

      - name: Require CHANGELOG + VERSION update for data/script changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if echo "$FILES" | grep -qE '^(data/machine/|scripts/|VERSION|CHANGELOG)'; then
            NEWV=$(cat VERSION | tr -d '[:space:]')
            OLDV=$(gh api "repos/${{ github.repository }}/contents/VERSION?ref=$BASE_SHA" --jq '.content' | base64 -d | tr -d '[:space:]')
            if [ "$NEWV" = "$OLDV" ]; then
              echo "::error::data/machine/ or scripts/ changed but VERSION was NOT bumped. Run: python scripts/bump_version.py --content|--feature --message '...'"
              exit 1
            fi
            if ! grep -q "^## $NEWV" CHANGELOG.md; then
              echo "::error::VERSION bumped to $NEWV but CHANGELOG.md has no '## $NEWV' section. Add a changelog entry (or run bump_version.py)."
              exit 1
            fi
            if ! grep -q "^## $NEWV" CHANGELOG.zh-CN.md; then
              echo "::error::CHANGELOG.zh-CN.md has no '## $NEWV' section either. Keep both changelogs in sync."
              exit 1
            fi
            echo "OK: VERSION bumped to $NEWV with changelog entries."
          else
            echo "No data/script changes; version bump not required."
          fi
